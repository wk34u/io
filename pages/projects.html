            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 60%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

                outline: 0;
                background: #222;
                width: 100%;
                border: 0;
                padding: 15px;
                color: #ffffff;
                font-size: 14px;
                cursor: pointer;

            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #222;
                filter: brightness(92%);
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                box-sizing: border-box; min-height: 100svh; height: auto; margin: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); background: #fff; color: #222; font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;

            .staticrypt-instructions {

            }

            .staticrypt-remember input[type="checkbox"] {

                margin-right: 1em;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;

                display: inline-block;
                width: 2rem;
                height: 2rem;

                border: 0.25em solid gray;
                border-right-color: transparent;
                border-radius: 50%;
                -webkit-animation: spinner-border 0.75s linear infinite;
                animation: spinner-border 0.75s linear infinite;
                animation-duration: 0.75s;
                animation-timing-function: linear;
                animation-delay: 0s;
                animation-iteration-count: infinite;
                animation-direction: normal;
                animation-fill-mode: none;
                animation-play-state: running;
                animation-name: spinner-border;
            }

            @keyframes spinner-border {
                100% {

                }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {

  const credentialNames = new Set(['key', 'staticrypt_pwd', 'remember_me', 'staticrypt_logout']);
  let hadCredentials = false;
  const remaining = rawFragment.split('&').filter(part => {
    const name = new URLSearchParams(part).keys().next().value;
    if (!credentialNames.has(name)) return true;
    hadCredentials = true;
    return false;
  }).join('&');
  return {
    password: parameters.get('key'), hashedPassword: parameters.get('staticrypt_pwd'), remaining, hadCredentials,
